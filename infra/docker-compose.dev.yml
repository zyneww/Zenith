services:
  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:v1.25.2
    container_name: zenith_dragonfly
    restart: unless-stopped
    command: --requirepass ${DRAGONFLY_PASSWORD:-dragonfly_dev}
    ports:
      - "6379:6379"
    volumes:
      - dragonfly_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${DRAGONFLY_PASSWORD:-dragonfly_dev}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - zenith

  questdb:
    image: questdb/questdb:7.4.0
    container_name: zenith_questdb
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9009:9009"
      - "8812:8812"
    volumes:
      - questdb_data:/root/.questdb
      - ./questdb/init.sql:/docker-entrypoint-initdb.d/init.sql
    environment:
      - QDB_PG_USER=zenith
      - QDB_PG_PASSWORD=${QUESTDB_PASSWORD:-questdb_dev}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - zenith

  ws-server:
    build:
      context: ../apps/ws-server
      dockerfile: Dockerfile
    container_name: zenith_ws
    restart: unless-stopped
    environment:
      - DRAGONFLY_URL=redis://:${DRAGONFLY_PASSWORD:-dragonfly_dev}@dragonfly:6379
      - PORT=3001
      - BINANCE_WS_URL=wss://stream.binance.com:9443/ws
      - NODE_ENV=production
      - CORS_ORIGINS=http://localhost:3000,https://zenith.xyz
      - QUESTDB_URL=postgresql://zenith:${QUESTDB_PASSWORD:-questdb_dev}@questdb:8812/qdb
    ports:
      - "3001:3001"
    depends_on:
      dragonfly:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - zenith
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

volumes:
  dragonfly_data:
  questdb_data:

networks:
  zenith:
    driver: bridge
